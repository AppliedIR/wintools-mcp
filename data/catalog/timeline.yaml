category: timeline
tools:
  - name: hayabusa
    binary: hayabusa.exe
    description: "Sigma-based Windows event log analysis; needs a command, e.g. dfir-timeline -d <evtx folder> -o <file.csv> -w"
    input_style: flag
    input_flag: "-d"
    output_format: csv
    common_flags:
      - flag: "dfir-timeline"
        description: "Command: create a DFIR timeline (CSV by default)"
      - flag: "-d"
        description: "Directory of multiple .evtx files"
      - flag: "-f"
        description: "File path to one .evtx file"
      - flag: "-o"
        description: "Save the timeline to a file (e.g. results.csv)"
      - flag: "-t"
        description: "Output format: csv (default), json, or jsonl"
      - flag: "-w"
        description: "Do not ask questions (needed for an unattended run)"
      - flag: "-m"
        description: "Minimum level for rules to load (default: informational)"
      - flag: "-U"
        description: "Output time in UTC (default: local time)"
    timeout_seconds: 1800
    fk_tool_name: Hayabusa
    settings_paths: ["rules", "config"]
    # Hayabusa's own version, should its file carry no VERSIONINFO: `help`
    # prints "Hayabusa vX" first on 3.x and 4.x (its --version fails on 3.9.0)
    # 4.x has dfir-timeline, 3.x csv-timeline: the subcommand's own help
    help_argv: [["dfir-timeline", "--help"], ["csv-timeline", "--help"], ["help"]]
    version_probe:
      argv: ["help"]
      pattern: "Hayabusa v?([0-9][^\\s]*)"
    install_methods:
      - method: github
        url: "https://github.com/Yamato-Security/hayabusa/releases"
        notes: "Auto-downloaded with analyst confirmation on first use"
    install_paths:
      - "C:\\Tools\\Hayabusa"

  - name: chainsaw
    binary: chainsaw.exe
    description: "Hunt and search Windows artifacts with Sigma and Chainsaw rules; needs a command: hunt <evtx path> -s <sigma> --mapping <map> | search <term> <evtx path>"
    input_style: positional
    output_format: text
    timeout_seconds: 1800
    fk_tool_name: chainsaw
    common_flags:
      - flag: "-r"
        description: "A path containing additional Chainsaw rules to hunt with"
      - flag: "-s"
        description: "A path containing Sigma rules to hunt with (needs --mapping)"
      - flag: "--mapping"
        description: "A mapping file telling Chainsaw how to use third-party (Sigma) rules"
      - flag: "--csv"
        description: "Switch: print the output in CSV format"
      - flag: "--json"
        description: "Switch: print the output in JSON format"
      - flag: "--full"
        description: "Print the full values for the tabular output"
    install_methods:
      - method: github
        url: "https://github.com/WithSecureLabs/chainsaw/releases"
        notes: "Download pre-built Windows binary from releases"
    install_paths:
      - "C:\\Tools\\Chainsaw"
      - "C:\\Tools"
    alternatives:
      - "hayabusa (alternative Sigma-based scanner)"

  - name: mactime
    binary: mactime.pl
    description: "Generate timeline from bodyfile (TSK mactime format)"
    input_style: flag
    input_flag: "-b"
    exec_type: script
    output_format: text
    timeout_seconds: 600
    fk_tool_name: mactime
    install_methods:
      - method: direct
        url: "https://strawberryperl.com"
        notes: "Requires Perl runtime (Strawberry Perl recommended on Windows)"
    install_paths:
      - "C:\\Strawberry\\perl\\bin"
    alternatives:
      - "log2timeline/plaso (if Perl not available)"
