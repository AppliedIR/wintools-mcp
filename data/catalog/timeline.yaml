category: timeline
tools:
  - name: hayabusa
    binary: hayabusa.exe
    description: "Sigma-based Windows event log analysis; its commands differ by version (3.x csv-timeline, 4.x dfir-timeline): see get_windows_tool_help"
    # Each recipe's flags are in that version's own help (tests/fixtures/tool_help)
    recipes:
      - task: "Timeline of a folder of .evtx files as CSV, without questions"
        versions: ">=3.9,<4"
        argv: ["csv-timeline", "-d", "<evtx folder>", "-o", "<file.csv>", "-w"]
        notes: "3.x: -t is --threads, not an output type"
      - task: "Timeline of one .evtx file as CSV, without questions"
        versions: ">=3.9,<4"
        argv: ["csv-timeline", "-f", "<file.evtx>", "-o", "<file.csv>", "-w"]
      - task: "The same, with times in UTC"
        versions: ">=3.9,<4"
        argv: ["csv-timeline", "-d", "<evtx folder>", "-o", "<file.csv>", "-w", "-U"]
    input_style: flag
    input_flag: "-d"
    output_format: csv
    timeout_seconds: 1800
    fk_tool_name: Hayabusa
    settings_paths: ["rules", "config"]
    # Hayabusa's own version, should its file carry no VERSIONINFO: `help`
    # prints "Hayabusa vX" first on 3.x and 4.x (its --version fails on 3.9.0)
    # 4.x has dfir-timeline, 3.x csv-timeline: the subcommand's own help
    help_argv: [["dfir-timeline", "--help"], ["csv-timeline", "--help"], ["help"]]
    version_probe:
      argv: ["help"]
      pattern: "Hayabusa v?([0-9][^\\s]*)"
    install_methods:
      - method: github
        url: "https://github.com/Yamato-Security/hayabusa/releases"
        notes: "Auto-downloaded with analyst confirmation on first use"
    install_paths:
      - "C:\\Tools\\Hayabusa"

  - name: chainsaw
    binary: chainsaw.exe
    description: "Hunt and search Windows artifacts with Sigma and Chainsaw rules; needs a command: hunt <evtx path> -s <sigma> --mapping <map> | search <term> <evtx path>"
    input_style: positional
    output_format: text
    timeout_seconds: 1800
    fk_tool_name: chainsaw
    install_methods:
      - method: github
        url: "https://github.com/WithSecureLabs/chainsaw/releases"
        notes: "Download pre-built Windows binary from releases"
    install_paths:
      - "C:\\Tools\\Chainsaw"
      - "C:\\Tools"
    alternatives:
      - "hayabusa (alternative Sigma-based scanner)"

  - name: mactime
    binary: mactime.pl
    description: "Generate timeline from bodyfile (TSK mactime format)"
    input_style: flag
    input_flag: "-b"
    exec_type: script
    output_format: text
    timeout_seconds: 600
    fk_tool_name: mactime
    install_methods:
      - method: direct
        url: "https://strawberryperl.com"
        notes: "Requires Perl runtime (Strawberry Perl recommended on Windows)"
    install_paths:
      - "C:\\Strawberry\\perl\\bin"
    alternatives:
      - "log2timeline/plaso (if Perl not available)"
