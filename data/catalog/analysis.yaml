category: analysis
tools:
  - name: capa
    binary: capa.exe
    description: "Detect capabilities in executable files using FLARE rules"
    input_style: positional
    output_format: text
    timeout_seconds: 600
    fk_tool_name: capa
    install_methods:
      - method: github
        url: "https://github.com/mandiant/capa/releases"
        notes: "Download pre-built Windows binary from releases"
    install_paths:
      - "C:\\Tools\\CAPA"
      - "C:\\Tools"

  - name: yara
    binary: yara64.exe
    description: "Pattern matching tool for malware identification"
    input_style: positional
    output_format: text
    timeout_seconds: 300
    fk_tool_name: yara
    # yara64.exe has no VERSIONINFO: its help's first line names the version
    version_probe:
      argv: ["--help"]
      pattern: "YARA ([0-9][^\\s,]*)"
    # Each recipe's flags are in that version's own help (tests/fixtures/tool_help)
    recipes:
      - task: "Scan a folder and its subfolders, printing matching strings and rule metadata"
        versions: ">=4.2,<5"
        argv: ["-r", "-s", "-m", "<rules file>", "<folder>"]
      - task: "Only the number of matches per file"
        versions: ">=4.2,<5"
        argv: ["-c", "<rules file>", "<file>"]
      - task: "Scan with compiled rules"
        versions: ">=4.2,<5"
        argv: ["-C", "<compiled rules file>", "<folder>"]
    install_methods:
      - method: github
        url: "https://github.com/VirusTotal/yara/releases"
        notes: "Download pre-built Windows binary"
      - method: chocolatey
        command: "choco install yara"
    install_paths:
      - "C:\\Tools\\YARA"
      - "C:\\Tools"
    alternatives:
      - "yara32.exe (for 32-bit scanning)"

  - name: densityscout
    binary: densityscout.exe
    description: "Measure entropy/density of files to identify packed or encrypted binaries"
    input_style: positional
    output_format: text
    timeout_seconds: 300
    fk_tool_name: densityscout
    install_methods:
      - method: direct
        url: "https://cert.at/en/downloads/software/software-densityscout"
        notes: "Download from CERT.at"
    install_paths:
      - "C:\\Tools\\DensityScout"
      - "C:\\Tools"
