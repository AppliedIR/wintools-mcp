category: memory
tools:
  - name: winpmem
    binary: winpmem.exe
    description: "Acquire physical memory dump for analysis"
    acquisition: true
    input_style: positional
    output_format: text
    timeout_seconds: 600
    fk_tool_name: winpmem
    common_flags:
      - flag: "<output path>"
        description: "Positional: the raw image file to write (e.g. winpmem.exe C:\\case\\mem.raw)"
      - flag: "-2"
        description: "Use PTE remapping (AMD64 only; the default on 64-bit)"
    install_methods:
      - method: github
        url: "https://github.com/Velocidex/WinPmem/releases"
        notes: "Download latest release binary"
    install_paths:
      - "C:\\Tools\\Memory"
      - "C:\\Tools"

  - name: dumpit
    binary: dumpit.exe
    description: "One-click physical memory acquisition"
    acquisition: true
    input_style: positional
    output_format: text
    timeout_seconds: 600
    fk_tool_name: dumpit
    install_methods:
      - method: direct
        url: "https://www.magnetforensics.com/resources/magnet-dumpit-for-windows/"
        notes: "Download from Magnet Forensics (requires registration)"
    install_paths:
      - "C:\\Tools\\Memory"
      - "C:\\Tools"

  - name: moneta
    binary: moneta64.exe
    description: "Detect malware through virtual memory analysis (injected threads, hollowed processes)"
    input_style: flag
    output_format: text
    timeout_seconds: 300
    fk_tool_name: moneta
    common_flags:
      - flag: "-m"
        description: "Required: the memory to select: * | region | referenced | ioc"
      - flag: "-p"
        description: "Required: the process to scan: a PID, or * for all"
      - flag: "--option"
        description: "from-base | statistics"
      - flag: "--filter"
        description: "unsigned-module | clr-prvx | clr-heap | metadata-modules"
      - flag: "-d"
        description: "Dump the selected memory"
    install_methods:
      - method: github
        url: "https://github.com/forrest-orr/moneta/releases"
        notes: "Download pre-built binary"
    install_paths:
      - "C:\\Tools\\Memory"
      - "C:\\Tools"

  - name: hollows_hunter
    binary: hollows_hunter.exe
    description: "Scan running processes for hollowed/injected code using PE-sieve (/pid or /pname: one per call, ';' lists are blocked)"
    input_style: flag
    output_format: text
    timeout_seconds: 300
    fk_tool_name: HollowsHunter
    common_flags:
      - flag: "/loop"
        description: "Continuous scanning mode"
      - flag: "/dir"
        description: "Output directory for dumps"
      - flag: "/json"
        description: "Output results as JSON"
    install_methods:
      - method: github
        url: "https://github.com/hasherezade/hollows_hunter/releases"
        notes: "Download pre-built binary"
    install_paths:
      - "C:\\Tools\\Memory"
      - "C:\\Tools"
