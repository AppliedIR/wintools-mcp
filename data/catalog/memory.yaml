category: memory
tools:
  - name: winpmem
    binary: winpmem.exe
    help_argv: [["-h"]]  # its help (tests/fixtures/tool_help/winpmem)
    description: "WinPmem (help: tests/fixtures/tool_help/winpmem, 2.0.1). A relative output name is written in the run's folder and recorded"
    input_style: positional
    output_format: text
    timeout_seconds: 600
    fk_tool_name: winpmem
    install_methods:
      - method: github
        url: "https://github.com/Velocidex/WinPmem/releases"
        notes: "Download latest release binary"
    install_paths:
      - "C:\\Tools\\Memory"
      - "C:\\Tools"
