category: collection
tools:
  - name: kape
    binary: kape.exe
    description: "Kroll Artifact Parser and Extractor: runs modules over files already collected into the case (--msource, --module, --mdest). Target mode (--tsource, --target, --tdest), --sync and the upload switches are refused. Not checked: a module that itself collects live data, and a _kape.cli file of saved commands"
    input_style: flag
    input_flag: "--msource"
    output_format: text
    timeout_seconds: 1800
    fk_tool_name: KAPE
    settings_paths: ["Targets", "Modules"]
    # Each recipe's flags are in that version's own help (tests/fixtures/tool_help)
    recipes:
      - task: "Run one module over files already collected"
        versions: ">=1.3,<2"
        argv: ["--msource", "<collected folder>", "--module", "<module>", "--mdest", "<output folder>"]
    install_methods:
      - method: direct
        url: "https://www.kroll.com/en/services/cyber-risk/incident-response-litigation-support/kroll-artifact-parser-extractor-kape"
        notes: "Requires Kroll license — download from Kroll website"
    install_paths:
      - "C:\\Tools\\KAPE"
      - "C:\\KAPE"
