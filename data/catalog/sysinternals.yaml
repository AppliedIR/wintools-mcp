category: sysinternals
tools:
  - name: autorunsc
    binary: autorunsc.exe
    description: "List autostart entries (registry, services, scheduled tasks, etc.)"
    input_style: flag
    input_flag: "-a"
    output_format: csv
    timeout_seconds: 300
    fk_tool_name: autorunsc
    common_flags:
      - flag: "-a *"
        description: "Scan all autostart categories"
      - flag: "-c"
        description: "Output as CSV"
      - flag: "-h"
        description: "Show file hashes"
      - flag: "-s"
        description: "Verify digital signatures"
      - flag: "-v"
        description: "Query VirusTotal"
      - flag: "-accepteula"
        description: "Accept EULA (required for first run)"
    install_methods:
      - method: direct
        url: "https://learn.microsoft.com/en-us/sysinternals/downloads/autoruns"
        notes: "Download from Sysinternals suite"
      - method: chocolatey
        command: "choco install sysinternals"
    install_paths:
      - "C:\\Tools\\SysinternalsSuite"
      - "C:\\SysinternalsSuite"

  - name: strings
    binary: strings64.exe
    description: "Extract printable strings from binary files"
    input_style: positional
    output_format: text
    timeout_seconds: 300
    fk_tool_name: strings
    common_flags:
      - flag: "-a"
        description: "Scan entire file (not just image sections)"
      - flag: "-n"
        description: "Minimum string length (default 3)"
      - flag: "-u"
        description: "Unicode strings only"
      - flag: "-accepteula"
        description: "Accept EULA (required for first run)"
    install_methods:
      - method: direct
        url: "https://learn.microsoft.com/en-us/sysinternals/downloads/strings"
        notes: "Download from Sysinternals suite"
      - method: chocolatey
        command: "choco install sysinternals"
    install_paths:
      - "C:\\Tools\\SysinternalsSuite"
      - "C:\\SysinternalsSuite"
    alternatives:
      - "strings.exe (32-bit version)"
      - "bstrings.exe (Zimmerman tool with regex support)"

  - name: handle
    binary: handle64.exe
    description: "List open file handles by process"
    input_style: positional
    output_format: text
    timeout_seconds: 120
    fk_tool_name: handle
    common_flags:
      - flag: "-a"
        description: "Show all handle information"
      - flag: "-p"
        description: "Filter by process name or PID"
      - flag: "-accepteula"
        description: "Accept EULA (required for first run)"
    install_methods:
      - method: direct
        url: "https://learn.microsoft.com/en-us/sysinternals/downloads/handle"
        notes: "Download from Sysinternals suite"
      - method: chocolatey
        command: "choco install sysinternals"
    install_paths:
      - "C:\\Tools\\SysinternalsSuite"
      - "C:\\SysinternalsSuite"
    alternatives:
      - "handle.exe (32-bit version)"

  - name: procdump
    binary: procdump64.exe
    description: "Dump process memory for analysis"
    input_style: positional
    output_format: text
    timeout_seconds: 300
    fk_tool_name: procdump
    common_flags:
      - flag: "-ma"
        description: "Full dump (all memory)"
      - flag: "-mp"
        description: "Mini plus dump"
      - flag: "-accepteula"
        description: "Accept EULA (required for first run)"
    install_methods:
      - method: direct
        url: "https://learn.microsoft.com/en-us/sysinternals/downloads/procdump"
        notes: "Download from Sysinternals suite"
      - method: chocolatey
        command: "choco install sysinternals"
    install_paths:
      - "C:\\Tools\\SysinternalsSuite"
      - "C:\\SysinternalsSuite"
    alternatives:
      - "procdump.exe (32-bit version)"

  - name: sigcheck
    binary: sigcheck.exe
    description: "Verify digital signatures and check VirusTotal for files"
    input_style: positional
    output_format: csv
    timeout_seconds: 300
    fk_tool_name: sigcheck
    success_exit_codes: [0, 1]
    exit_code_meanings:
      0: "all files signed"
      1: "unsigned files found"
    common_flags:
      - flag: "-c"
        description: "Output as CSV"
      - flag: "-e"
        description: "Scan executable images only"
      - flag: "-s"
        description: "Recurse subdirectories"
      - flag: "-u"
        description: "Show unsigned files only"
      - flag: "-v"
        description: "Query VirusTotal"
      - flag: "-h"
        description: "Show file hashes"
      - flag: "-accepteula"
        description: "Accept EULA (required for first run)"
    install_methods:
      - method: direct
        url: "https://learn.microsoft.com/en-us/sysinternals/downloads/sigcheck"
        notes: "Download from Sysinternals suite"
      - method: chocolatey
        command: "choco install sysinternals"
    install_paths:
      - "C:\\Tools\\SysinternalsSuite"
      - "C:\\SysinternalsSuite"
