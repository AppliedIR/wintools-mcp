[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wintools-mcp"
version = "0.5.1"
description = "Windows forensic MCP: CLI tool execution with dynamic discovery and installation guidance"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AppliedIncidentResponse.com"},
]
keywords = ["mcp", "forensics", "incident-response", "windows", "dfir"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "mcp>=1.26",
    "pyyaml>=6.0",
    "starlette>=0.49.1",
    "uvicorn>=0.30",
    "cryptography>=41",
]

[project.optional-dependencies]
fk = ["forensic-knowledge"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wintools_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/", "data/", "tests/", "README.md", "LICENSE"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (let formatter handle)
    "SIM105", # contextlib.suppress — verbose for existing code
    "SIM108", # ternary operator — readability preference
    "SIM115", # context manager for open — not always applicable
    "SIM112", # capitalized env vars — Windows vars are case-sensitive
    "SIM117", # combine with statements — verbose for existing code
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/wintools_mcp"]
branch = true
